name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - feature/workflows

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Set up virtual environment
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt

# Crea un step para subir un artifact con nombre python-app # Con (ctrl + i) + /edit lo toma mejor
    - name: Upload artifact 
      uses: actions/upload-artifact@v4      
      with:
        name: python-app
        path: |
          .
          !venv/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
# Crea un step para descragar el artifact con nombre python-app en el root del workspace
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: python-app

    - name: Deploy to Azure Web App
      # This action deploys the application to an Azure Web App.
      # Documentation: https://github.com/Azure/webapps-deploy
      uses: azure/webapps-deploy@v2
      with:
        app-name: demo-copilot-cicd
        slot-name: production
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

